services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_pw
      POSTGRES_DB: nexus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Browser DB client at http://localhost:8080
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: nexus_test
      POSTGRES_PASSWORD: nexus_test_pw
      POSTGRES_DB: nexus_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U nexus_test -d nexus_test",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata: